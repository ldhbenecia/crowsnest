name: Release

# v0.2.0 같은 태그를 push 하면 dmg · zip 을 만들어 GitHub Release 에 올림
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # 릴리스 노트가 직전 태그부터의 커밋을 읽어서 히스토리 · 태그를 전부 받음
          fetch-depth: 0

      - name: Check tag matches VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "태그 $GITHUB_REF_NAME 와 VERSION 파일($VERSION)이 다름" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: ./script/test.sh

      - name: Package
        run: ./script/package.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="dist/Crowsnest-$VERSION.dmg"
          ZIP="dist/Crowsnest.zip"
          ./script/release_notes.sh "$GITHUB_REF_NAME" "$DMG" > release-notes.md
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" "$ZIP" "$ZIP.sha256" \
            --title "Crowsnest $VERSION" \
            --notes-file release-notes.md
