name: Release

# v0.2.0 같은 태그를 push 하면 dmg 를 만들어 GitHub Release 에 올림
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "태그 $GITHUB_REF_NAME 와 VERSION 파일($VERSION)이 다름" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: ./script/test.sh

      - name: Package
        run: ./script/package.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="dist/Crowsnest-$VERSION.dmg"
          SHA256="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          gh release create "$GITHUB_REF_NAME" "$DMG" \
            --title "Crowsnest $VERSION" \
            --generate-notes \
            --notes "SHA-256: \`$SHA256\`

          Not notarized — on first launch right-click the app → Open, or run \`xattr -dr com.apple.quarantine /Applications/Crowsnest.app\`."
